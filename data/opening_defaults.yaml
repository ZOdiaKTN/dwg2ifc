# Default height, sill, and width values per opening category (in millimetres).
# Override any value here; missing keys keep their defaults.
#
# defaults used when this file is absent or a key is omitted:
#   doors:   height 2100, sill 0, width from DXF block bbox
#   windows: height 1200, sill 900, width from DXF block bbox

DOOR:
  height_mm: 2100
  sill_mm: 0

WINDOW:
  height_mm: 1200
  sill_mm: 900

